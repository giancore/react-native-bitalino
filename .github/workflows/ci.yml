name: CI

on:
    pull_request:
        branches:
            - master
            - develop
    push:
        branches:
            - master
            - develop

jobs:
    lint-and-typecheck:
        name: Lint & Type Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Type check
              run: npx tsc --noEmit

    build:
        name: Build Module
        runs-on: ubuntu-latest
        needs: lint-and-typecheck

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build module
              run: npm run build

            - name: Check build output
              run: |
                  if [ ! -f "build/index.js" ]; then
                    echo "Build failed: index.js not found"
                    exit 1
                  fi
                  if [ ! -f "build/index.d.ts" ]; then
                    echo "Build failed: index.d.ts not found"
                    exit 1
                  fi
                  echo "✅ Build output validated"

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: build-output
                  path: build/
                  retention-days: 7

    validate-android:
        name: Validate Android Module
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Setup Gradle
              uses: gradle/gradle-build-action@v3

            - name: Validate Gradle wrapper
              uses: gradle/wrapper-validation-action@v2

            - name: Check Android module syntax
              run: |
                  cd android
                  ./gradlew assembleDebug --no-daemon --warning-mode all

    validate-ios:
        name: Validate iOS Module
        runs-on: macos-latest
        needs: build

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Ruby
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: "3.2"
                  bundler-cache: true

            - name: Validate Podspec
              run: |
                  cd ios
                  pod lib lint ReactNativeBitalino.podspec --allow-warnings --verbose

            - name: Check Swift syntax
              run: |
                  cd ios
                  swiftc -typecheck ReactNativeBitalinoModule.swift || echo "⚠️ Swift validation skipped (requires PluxAPI.framework)"

    validate-example:
        name: Validate Example App
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: "npm"

            - name: Install root dependencies
              run: npm ci

            - name: Install example dependencies
              run: |
                  cd example
                  npm ci

            - name: Type check example
              run: |
                  cd example
                  npx tsc --noEmit

    security-audit:
        name: Security Audit
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x

            - name: Run npm audit
              run: npm audit --audit-level=moderate
              continue-on-error: true

    all-checks-passed:
        name: All Checks Passed
        runs-on: ubuntu-latest
        needs:
            - lint-and-typecheck
            - build
            - validate-android
            - validate-ios
            - validate-example
        if: always()

        steps:
            - name: Check all jobs
              run: |
                  if [ "${{ needs.lint-and-typecheck.result }}" != "success" ] || \
                     [ "${{ needs.build.result }}" != "success" ] || \
                     [ "${{ needs.validate-android.result }}" != "success" ] || \
                     [ "${{ needs.validate-ios.result }}" != "success" ] || \
                     [ "${{ needs.validate-example.result }}" != "success" ]; then
                    echo "❌ Some checks failed"
                    exit 1
                  fi
                  echo "✅ All checks passed!"
