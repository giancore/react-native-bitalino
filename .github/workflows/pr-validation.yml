name: Validate PR

on:
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    validate-pr:
        name: PR Quality Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Validate PR title
              uses: amannn/action-semantic-pull-request@v5
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  types: |
                      feat
                      fix
                      docs
                      style
                      refactor
                      perf
                      test
                      build
                      ci
                      chore
                  requireScope: false

            - name: Check for changeset
              if: github.event.pull_request.base.ref == 'master'
              run: |
                  if [ ! -d ".changeset" ] || [ -z "$(ls -A .changeset/*.md 2>/dev/null | grep -v README)" ]; then
                    echo "⚠️ Warning: No changeset found. Consider adding one with 'npm run changeset'"
                    echo "This is recommended for changes that affect the public API."
                  else
                    echo "✅ Changeset found"
                  fi

    size-check:
        name: Package Size Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Check package size
              run: |
                  SIZE=$(du -sh build | cut -f1)
                  echo "📦 Build size: $SIZE"

                  # Alert if build is larger than 1MB
                  SIZE_BYTES=$(du -sb build | cut -f1)
                  if [ $SIZE_BYTES -gt 1048576 ]; then
                    echo "⚠️ Warning: Build size exceeds 1MB"
                  else
                    echo "✅ Build size is acceptable"
                  fi

    dependency-review:
        name: Dependency Review
        runs-on: ubuntu-latest
        if: github.event.pull_request.base.ref == 'master'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Dependency Review
              uses: actions/dependency-review-action@v4
              with:
                  fail-on-severity: moderate
